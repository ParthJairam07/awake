# Every action in .github/workflows is pinned by full commit SHA with a
# version comment. Dependabot opens a pull request when a newer release
# exists and rewrites both the SHA and the comment. Package.swift has one
# dependency, Sparkle (auto-updates), pinned in Package.resolved; Dependabot
# proposes its new releases the same way.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      # Wait 7 days after a release before proposing it, so a release that
      # is yanked or found compromised in its first week never reaches a PR
      # (zizmor's dependabot-cooldown audit).
      default-days: 7
    commit-message:
      # Matches the repo's "Area: what changed" subject style.
      prefix: "CI"
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "Deps"
